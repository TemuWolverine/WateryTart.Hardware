substitutions:
  friendly_name: WateryTart_CYD

  i2c_sda: "27"
  i2c_scl: "22"

  tft_clk: "14"
  tft_mosi: "13"
  tft_miso: "12"

  touch_clk: "25"
  touch_mosi: "32"
  touch_miso: "39"
  touch_cs: "33"
  touch_interupt: "36"

esphome:
  name: esphome-web-bdbcec
  friendly_name: ${friendly_name}
  min_version: 2025.11.0
  name_add_mac_suffix: false

esp32:
  variant: esp32
  framework:
    type: esp-idf

logger:

api:
  homeassistant_services: true
  reboot_timeout: 0s

ota:
  - platform: esphome

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password

http_request:
  useragent: esphome/esphome-web-bdbcec
  timeout: 10s

i2c:
  - sda: ${i2c_sda}
    scl: ${i2c_scl}
    scan: true

spi:
  - id: tft
    clk_pin: ${tft_clk}
    mosi_pin: ${tft_mosi}
    miso_pin:
      number: ${tft_miso}
      ignore_strapping_warning: true
  - id: touch
    clk_pin: ${touch_clk}
    mosi_pin: ${touch_mosi}
    miso_pin: ${touch_miso}

globals:
  - id: current_index
    type: int
    initial_value: '0'

  - id: current_entity_id
    type: std::string
    restore_value: no
    initial_value: '""'

  - id: title_scroll_offset
    type: int
    restore_value: no
    initial_value: '0'

  - id: title_scroll_pause_counter
    type: int
    restore_value: no
    initial_value: '0'

  - id: last_title
    type: std::string
    restore_value: no
    initial_value: '""'

  - id: media_duration_val
    type: float
    restore_value: no
    initial_value: '0'

  - id: media_position_val
    type: float
    restore_value: no
    initial_value: '0'

  - id: player_is_playing
    type: bool
    restore_value: no
    initial_value: 'false'

  - id: last_album_art_url
    type: std::string
    restore_value: no
    initial_value: '""'

  - id: pending_art_url
    type: std::string
    restore_value: no
    initial_value: '""'

image:
  - id: album_art_placeholder
    file: "mdi:album"
    resize: 128x128
    type: RGB565

online_image:
  - id: album_art_image
    url: "https://placehold.co/128x128"
    resize: 128x128
    format: JPEG
    type: RGB565
    on_download_finished:
      then:
        - lambda: |-
            const uint8_t *data = id(album_art_image).get_data_start();
            int total_pixels = 128 * 128;
            uint8_t *buf = const_cast<uint8_t *>(data);
            for (int i = 0; i < total_pixels * 2; i += 2) {
              uint16_t pixel = ((uint16_t)buf[i] << 8) | buf[i + 1];
              uint16_t r = (pixel >> 11) & 0x1F;
              uint16_t g = (pixel >> 5)  & 0x3F;
              uint16_t b = (pixel)       & 0x1F;
              uint16_t swapped = (b << 11) | (g << 5) | r;
              buf[i]     = (swapped >> 8) & 0xFF;
              buf[i + 1] = swapped & 0xFF;
            }
        - lvgl.image.update:
            id: img_albumart
            src: album_art_image
    on_error:
      then:
        - lvgl.image.update:
            id: img_albumart
            src: album_art_placeholder

output:
  - id: backlight_pwm
    platform: ledc
    pin: 21
  - id: output_red
    platform: ledc
    pin: 4
    inverted: true
  - id: output_green
    platform: ledc
    pin: 16
    inverted: true
  - id: output_blue
    platform: ledc
    pin: 17
    inverted: true

light:
  - id: backlight
    platform: monochromatic
    output: backlight_pwm
    name: Display Backlight
    restore_mode: ALWAYS_ON

  - id: led
    platform: rgb
    red: output_red
    green: output_green
    blue: output_blue
    restore_mode: ALWAYS_OFF

script:
  # ---------------------------------------------------------------------------
  # Fetch album art
  # ---------------------------------------------------------------------------
  - id: fetch_album_art
    then:
      - lambda: |-
          std::string url = id(pending_art_url);
          if (url.length() > 0 && url != id(last_album_art_url)) {
            id(last_album_art_url) = url;
            id(album_art_image).set_url(url.c_str());
            id(album_art_image).update();
          }
      - if:
          condition:
            lambda: 'return id(pending_art_url).empty();'
          then:
            - lvgl.image.update:
                id: img_albumart
                src: album_art_placeholder

  # ---------------------------------------------------------------------------
  # Main display update — parse sensor, update globals, labels, progress, art
  # ---------------------------------------------------------------------------
  - id: update_player_display
    then:
      - lambda: |-
          std::string input = id(ma_queue_sensor).state;

          if (input == "none" || input.length() == 0) {
            id(current_entity_id) = "";
            id(player_is_playing) = false;
            id(pending_art_url) = "";
            lv_label_set_text(id(lb_track),     "No players");
            lv_label_set_text(id(lb_artist),    "");
            lv_label_set_text(id(lb_player),    "");
            lv_label_set_text(id(lb_playpause), LV_SYMBOL_PLAY);
            lv_bar_set_value(id(lv_bar_5), 0, LV_ANIM_OFF);
            return;
          }

          // Split entries by "|||"
          std::vector<std::string> entries;
          size_t prev = 0, pos = 0;
          while ((pos = input.find("|||", prev)) != std::string::npos) {
            entries.push_back(input.substr(prev, pos - prev));
            prev = pos + 3;
          }
          entries.push_back(input.substr(prev));

          // Clamp index
          int idx = id(current_index);
          if (idx < 0) idx = 0;
          if (idx >= (int)entries.size()) idx = 0;
          id(current_index) = idx;

          // Split selected entry by "::"
          std::string entry = entries[idx];
          std::vector<std::string> attrs;
          prev = 0;
          while ((pos = entry.find("::", prev)) != std::string::npos) {
            attrs.push_back(entry.substr(prev, pos - prev));
            prev = pos + 2;
          }
          attrs.push_back(entry.substr(prev));

          std::string entity_id    = (attrs.size() > 0) ? attrs[0] : "";
          std::string media_title  = (attrs.size() > 1) ? attrs[1] : "";
          std::string media_artist = (attrs.size() > 2) ? attrs[2] : "";
          std::string player_name  = (attrs.size() > 4) ? attrs[4] : "";
          std::string player_state = (attrs.size() > 5) ? attrs[5] : "";
          std::string duration_str = (attrs.size() > 7) ? attrs[7] : "0";
          std::string position_str = (attrs.size() > 8) ? attrs[8] : "0";
          std::string art_url      = (attrs.size() > 9) ? attrs[9] : "";

          // Store entity + state
          id(current_entity_id) = entity_id;
          id(player_is_playing)  = (player_state == "playing");

          // Store duration/position
          id(media_duration_val) = atof(duration_str.c_str());
          id(media_position_val) = atof(position_str.c_str());

          // Reset scroll if title changed
          if (media_title != id(last_title)) {
            id(last_title) = media_title;
            id(title_scroll_offset) = 0;
            id(title_scroll_pause_counter) = 0;
          }

          // Update labels
          lv_label_set_text(id(lb_track),     media_title.empty()  ? "Unknown Title"  : media_title.c_str());
          lv_label_set_text(id(lb_artist),    media_artist.empty() ? "Unknown Artist" : media_artist.c_str());
          lv_label_set_text(id(lb_player),    player_name.empty()  ? entity_id.c_str() : player_name.c_str());
          lv_label_set_text(id(lb_playpause), (player_state == "playing") ? LV_SYMBOL_PAUSE : LV_SYMBOL_PLAY);

          // Update progress bar
          if (id(media_duration_val) > 0) {
            int pct = (int)((id(media_position_val) / id(media_duration_val)) * 100.0f);
            if (pct < 0) pct = 0;
            if (pct > 100) pct = 100;
            lv_bar_set_value(id(lv_bar_5), pct, LV_ANIM_OFF);
          } else {
            lv_bar_set_value(id(lv_bar_5), 0, LV_ANIM_OFF);
          }

          // Store art URL for fetch script
          id(pending_art_url) = art_url;

      - script.execute: fetch_album_art

  # ---------------------------------------------------------------------------
  # Populate the player-selection list on Page 2
  # ---------------------------------------------------------------------------
  - id: populate_player_list
    then:
      - lambda: |-
          // Clear previously created children
          lv_obj_clean(id(player_list));

          std::string input = id(ma_queue_sensor).state;

          if (input == "none" || input.length() == 0) {
            lv_obj_t *btn = lv_obj_create(id(player_list));
            lv_obj_set_size(btn, 220, 40);
            lv_obj_set_style_bg_color(btn, lv_color_hex(0x1F2937), LV_PART_MAIN);
            lv_obj_set_style_bg_opa(btn, LV_OPA_COVER, LV_PART_MAIN);
            lv_obj_set_style_border_width(btn, 0, LV_PART_MAIN);
            lv_obj_t *lbl = lv_label_create(btn);
            lv_label_set_text(lbl, "No players available");
            lv_obj_set_style_text_color(lbl, lv_color_hex(0xC0C0C0), LV_PART_MAIN);
            lv_obj_center(lbl);
            return;
          }

          // Split entries by "|||"
          std::vector<std::string> entries;
          size_t prev = 0, pos = 0;
          while ((pos = input.find("|||", prev)) != std::string::npos) {
            entries.push_back(input.substr(prev, pos - prev));
            prev = pos + 3;
          }
          entries.push_back(input.substr(prev));

          for (int i = 0; i < (int)entries.size(); i++) {
            std::string entry = entries[i];
            std::vector<std::string> attrs;
            prev = 0;
            while ((pos = entry.find("::", prev)) != std::string::npos) {
              attrs.push_back(entry.substr(prev, pos - prev));
              prev = pos + 2;
            }
            attrs.push_back(entry.substr(prev));

            std::string player_name  = (attrs.size() > 4) ? attrs[4] : "";
            std::string entity_id    = (attrs.size() > 0) ? attrs[0] : "";
            std::string media_title  = (attrs.size() > 1) ? attrs[1] : "";
            std::string player_state = (attrs.size() > 5) ? attrs[5] : "";

            bool is_selected = (i == id(current_index));

            // Create a button-style container
            lv_obj_t *btn = lv_obj_create(id(player_list));
            lv_obj_set_size(btn, 220, 52);
            lv_obj_set_style_bg_color(btn,
              is_selected ? lv_color_hex(0x4F46E5) : lv_color_hex(0x1F2937),
              LV_PART_MAIN);
            lv_obj_set_style_bg_opa(btn, LV_OPA_COVER, LV_PART_MAIN);
            lv_obj_set_style_border_width(btn, 0, LV_PART_MAIN);
            lv_obj_set_style_pad_all(btn, 6, LV_PART_MAIN);
            lv_obj_clear_flag(btn, LV_OBJ_FLAG_SCROLLABLE);

            // Player name (top line)
            lv_obj_t *lbl_name = lv_label_create(btn);
            std::string name_str = player_name.empty() ? entity_id : player_name;
            if (is_selected) name_str = std::string(LV_SYMBOL_AUDIO) + " " + name_str;
            lv_label_set_text(lbl_name, name_str.c_str());
            lv_label_set_long_mode(lbl_name, LV_LABEL_LONG_CLIP);
            lv_obj_set_width(lbl_name, 208);
            lv_obj_set_style_text_color(lbl_name, lv_color_hex(0xFFFFFF), LV_PART_MAIN);
            lv_obj_align(lbl_name, LV_ALIGN_TOP_LEFT, 0, 0);

            // Track + state (bottom line)
            lv_obj_t *lbl_sub = lv_label_create(btn);
            std::string sub_str = media_title.empty()
              ? ("(" + player_state + ")")
              : (media_title + " [" + player_state + "]");
            lv_label_set_text(lbl_sub, sub_str.c_str());
            lv_label_set_long_mode(lbl_sub, LV_LABEL_LONG_CLIP);
            lv_obj_set_width(lbl_sub, 208);
            lv_obj_set_style_text_color(lbl_sub, lv_color_hex(0xA0AEC0), LV_PART_MAIN);
            lv_obj_align(lbl_sub, LV_ALIGN_BOTTOM_LEFT, 0, 0);

            // Store index as user data and attach click handler
            lv_obj_set_user_data(btn, (void*)(intptr_t)i);
            lv_obj_add_event_cb(btn, [](lv_event_t *e) {
              lv_obj_t *target = lv_event_get_target(e);
              int chosen = (int)(intptr_t)lv_obj_get_user_data(target);
              if (chosen < 0) return;
              id(current_index) = chosen;
              id(title_scroll_offset) = 0;
              id(title_scroll_pause_counter) = 0;
              id(update_player_display).execute();
              lv_scr_load(id(canvas_1)->obj);
            }, LV_EVENT_CLICKED, NULL);
          }

interval:
  - interval: 1s
    then:
      - lambda: |-
          if (id(player_is_playing) && id(media_duration_val) > 0) {
            id(media_position_val) += 1.0f;
            if (id(media_position_val) > id(media_duration_val))
              id(media_position_val) = id(media_duration_val);
            int pct = (int)((id(media_position_val) / id(media_duration_val)) * 100.0f);
            if (pct > 100) pct = 100;
            lv_bar_set_value(id(lv_bar_5), pct, LV_ANIM_OFF);
          }

text_sensor:
  - platform: homeassistant
    id: ma_queue_sensor
    entity_id: sensor.all_music_players
    attribute: players
    on_value:
      then:
        - lambda: |-
            std::string input = id(ma_queue_sensor).state;
            if (input == "none" || input.length() == 0) {
              id(current_entity_id) = "";
              id(current_index) = 0;
            } else if (id(current_entity_id).empty() || id(current_entity_id) == "none") {
              id(current_index) = 0;
            }
        - script.execute: update_player_display

display:
  - id: main_display
    platform: ili9xxx
    model: ili9342
    rotation: 90
    spi_id: tft
    cs_pin: GPIO15
    dc_pin: GPIO2
    color_order: BGR
    invert_colors: False
    update_interval: never
    auto_clear_enabled: false

touchscreen:
  - id: main_touchscreen
    platform: xpt2046
    spi_id: touch
    cs_pin: ${touch_cs}
    interrupt_pin: ${touch_interupt}
    threshold: 400
    calibration:
      x_min: 280
      x_max: 3860
      y_min: 340
      y_max: 3860
    transform:
      mirror_x: true

lvgl:
  buffer_size: 5%
  pages:

    # =========================================================================
    # PAGE 1 — Now Playing
    # =========================================================================
    - id: canvas_1
      bg_color: 0x000000
      widgets:

        # Album art — centred: (240 - 128) / 2 = 56
        - image:
            id: img_albumart
            x: 56
            y: 10
            width: 128
            height: 128
            src: album_art_placeholder

        # Open player list button (top-right corner)
        - button:
            id: lv_button_open_list
            x: 200
            y: 5
            width: 35
            height: 30
            bg_color: 0x374151
            widgets:
              - label:
                  text: LV_SYMBOL_LIST
                  text_color: 0xFFFFFF
            on_press:
              then:
                - script.execute: populate_player_list
                - lvgl.page.show: canvas_2

         # Previous track button
        - button:
            id: lv_button_prev_track
            x: 35
            y: 255
            width: 40
            height: 40
            bg_color: 0x4F46E5
            widgets:
              - label:
                  id: lb_prevtrack
                  text_align: CENTER
                  text: "<<"
                  text_color: 0xFFFFFF
            on_press:
              then:
                - homeassistant.service:
                    service: media_player.media_previous_track
                    data:
                      entity_id: !lambda 'return id(current_entity_id);'

        # Play/Pause button — centred: (240 - 50) / 2 = 95
        - button:
            id: lv_button_playpause
            x: 95
            y: 250
            width: 50
            height: 50
            bg_color: 0x4F46E5
            widgets:
              - label:
                  id: lb_playpause
                  text_align: CENTER
                  text: LV_SYMBOL_PLAY
                  text_color: 0xFFFFFF
            on_press:
              then:
                - homeassistant.service:
                    service: media_player.media_play_pause
                    data:
                      entity_id: !lambda 'return id(current_entity_id);'

        # Next track button
        - button:
            id: lv_button_next_track
            x: 165
            y: 255
            width: 40
            height: 40
            bg_color: 0x4F46E5
            widgets:
              - label:
                  id: lb_nexttrack
                  text_align: CENTER
                  text: ">>"
                  text_color: 0xFFFFFF
            on_press:
              then:
                - homeassistant.service:
                    service: media_player.media_next_track
                    data:
                      entity_id: !lambda 'return id(current_entity_id);'

        # Progress bar
        - bar:
            id: lv_bar_5
            x: 10
            y: 228
            width: 220
            height: 10
            value: 0
            min_value: 0
            max_value: 100
            indicator:
              bg_color: 0x4F46E5
            bg_color: 0x1F2937

        # Track title — scrolling
        - label:
            id: lb_track
            x: 0
            y: 148
            width: 240
            height: 20
            text: "Loading..."
            text_color: 0xFFFFFF
            text_align: CENTER
            long_mode: SCROLL

        # Artist
        - label:
            id: lb_artist
            x: 0
            y: 170
            width: 240
            height: 20
            text: ""
            text_color: 0xFFFFFF
            text_align: CENTER

        # Player name
        - label:
            id: lb_player
            x: 0
            y: 192
            width: 240
            height: 20
            text: ""
            text_color: 0xC0C0C0
            text_align: CENTER

    # =========================================================================
    # PAGE 2 — Player Selection
    # =========================================================================
    - id: canvas_2
      bg_color: 0x000000
      widgets:

        # Header background bar
        - obj:
            x: 0
            y: 0
            width: 240
            height: 36
            bg_color: 0x1F2937
            border_width: 0
            pad_all: 0
            widgets:
              - label:
                  x: 0
                  y: 8
                  width: 180
                  height: 20
                  text: "Select Player"
                  text_color: 0xFFFFFF
                  text_align: CENTER

        # Back button (top-right of header)
        - button:
            id: lv_button_back
            x: 195
            y: 3
            width: 40
            height: 30
            bg_color: 0x4F46E5
            widgets:
              - label:
                  text: LV_SYMBOL_LEFT
                  text_color: 0xFFFFFF
            on_press:
              then:
                - lvgl.page.show: canvas_1

        # Scrollable container for the player list
        - obj:
            id: player_list
            x: 10
            y: 42
            width: 220
            height: 278
            bg_color: 0x000000
            border_width: 0
            pad_all: 4
            scrollable: true
            layout:
              type: FLEX
              flex_flow: COLUMN
              flex_align_main: START
              flex_align_cross: CENTER
              flex_align_track: CENTER
            widgets: []