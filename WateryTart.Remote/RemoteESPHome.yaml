#CONFIG START
substitutions:
  device_name: esphome-web-ee8248
  friendly_name: WateryTart.Remote

  #Display
  pin_i2c_sca: GPIO14
  pin_i2c_scl: GPIO27

  #Wakup switch
  pin_wakeup: GPIO0

  #Row 1
  pin_track_previous: GPIO17
  pin_play_pause: GPIO2
  pin_track_next: GPIO26

  #Row 2
  pin_repeat: GPIO5
  pin_fav: GPIO4
  pin_shuffle: GPIO25

  #Row 3
  pin_vol_up: GPIO18
  #blank
  pin_player_next: GPIO33


  #Row 4
  pin_vol_down: GPIO23
  #blank
  pin_player_previous: GPIO32
  
  #Row5
  pin_vol_mute: GPIO19
  pin_misc: GPIO16


  time_before_sleep: 60 #in seconds


esphome:
    on_boot:
    - priority: 250
      then:
        - lambda: |-
            auto cause = esp_sleep_get_wakeup_cause();
            if (cause == ESP_SLEEP_WAKEUP_EXT0) {
              id(oled_display).turn_on();
              ESP_LOGI("main", "Device woke up by EXT0");
            } else if (cause == ESP_SLEEP_WAKEUP_TIMER) {
              ESP_LOGD("main", "Device woke up by timer.");
            } else {
              ESP_LOGD("main", "Device woke up by other cause: %d", cause);
            }

#Deep Sleep
script:
  - id: reset_idle_timer
    then:
      - lambda: |-
          id(last_active) = millis() / 1000;

deep_sleep:
  id: deep_sleep_ctrl
  sleep_duration: 2800 min
  wakeup_pin:
    - pin:
        number: ${pin_wakeup}
        inverted: True  # will wake up when P8 is low
      wakeup_pin_mode: KEEP_AWAKE # will prevent sleep as long as P8 is low


interval:
  - interval: 60s
    then:
      - if:
          condition:
            lambda: return (millis() / 1000) - id(last_active) >= ${time_before_sleep};
          then:
            - lambda: |-
                id(oled_display).turn_off();
            - deep_sleep.enter: deep_sleep_ctrl

  # Runs every 300ms — increments scroll offset after a pause period
  # pause_counter threshold of 10 = 10 * 300ms = 3 seconds pause before scroll
  - interval: 300ms
    then:
      - lambda: |-
          const int PAUSE_TICKS = 10; // 10 * 300ms = 3 seconds before scrolling starts
          id(title_scroll_pause_counter) += 1;
          if (id(title_scroll_pause_counter) > PAUSE_TICKS) {
            id(title_scroll_offset) += 1;
          }

packages:
  esphome_templates:
    url: https://github.com/TemuWolverine/esphome_templates
    ref: main
    refresh: 1d
    files:
      - esphome_boilerplate.yaml
      - boards/wemos_lolin_d32.yaml
      - devices/display/ssd1306_i2c.yaml

i2c:
  sda: ${pin_i2c_sca}
  scl: ${pin_i2c_scl}
  scan: false

globals:
  - id: last_active
    type: int
    restore_value: no
    initial_value: '0'

  - id: current_index
    type: int
    initial_value: '0'

  - id: target_entity_id
    type: std::string
    restore_value: no
    initial_value: '""'

  - id: current_entity_id
    type: std::string
    restore_value: no
    initial_value: '""'

  - id: title_scroll_offset
    type: int
    restore_value: no
    initial_value: '0'

  # Counts up from 0, scrolling only starts after a threshold
  - id: title_scroll_pause_counter
    type: int
    restore_value: no
    initial_value: '0'

  # Track the last title so we can reset scroll when it changes
  - id: last_title
    type: std::string
    restore_value: no
    initial_value: '""'

# Font definitions
font:
  - file: 
      type: gfonts
      family: Roboto Mono
      weight: 400
    id: basicfont
    size: 12

  - file: 
      type: gfonts
      family: Roboto Mono
      weight: 400
    id: basicfont_10
    size: 10

  - file: 'gfonts://Material+Symbols+Outlined'
    id: icon_font
    size: 14
    glyphs: [
      "\U0000e034", # Pause
      "\U0000e037"  # Play
    ]



display:
  - id: !extend oled_display
    lambda: |-
      std::string input = id(ma_queue_sensor).state;
      if (input == "none" || input.length() == 0) {
        it.printf(0, 0, id(basicfont), "No players found");
        return;
      }

      // Split into player entries
      std::vector<std::string> entries;
      size_t prev = 0, pos = 0;
      while ((pos = input.find("|||", prev)) != std::string::npos) {
        entries.push_back(input.substr(prev, pos - prev));
        prev = pos + 3;
      }
      entries.push_back(input.substr(prev));
      int idx = id(current_index);
      if (idx < 0) idx = 0;
      if (idx >= (int)entries.size()) idx = 0;
      std::string entry = entries[idx];
      std::vector<std::string> attrs;
      prev = 0;
      while ((pos = entry.find("::", prev)) != std::string::npos) {
        attrs.push_back(entry.substr(prev, pos - prev));
        prev = pos + 2;
      }
      attrs.push_back(entry.substr(prev));

      std::string entity_id    = (attrs.size() > 0) ? attrs[0] : "";
      std::string media_title  = (attrs.size() > 1) ? attrs[1] : "";
      std::string media_artist = (attrs.size() > 2) ? attrs[2] : "";
      std::string source       = (attrs.size() > 3) ? attrs[3] : "";
      std::string player_name  = (attrs.size() > 4) ? attrs[4] : "";
      std::string player_state = (attrs.size() > 5) ? attrs[5] : "";
      std::string repeat       = (attrs.size() > 6) ? attrs[6] : "";

      // -- Reset scroll if title has changed --
      if (media_title != id(last_title)) {
        id(last_title) = media_title;
        id(title_scroll_offset) = 0;
        id(title_scroll_pause_counter) = 0;
      }

      // -- Layout (128x128) --
      // y=0   : Scrolling media title  (top)
      // y=18  : Artist
      // y=100 : Play/Pause icon + state label
      // y=114 : Player name            (bottom)

      const int max_title_chars = 16;
      const int icon_x = 112;

      // -- Scrolling title (top) --
      if ((int)media_title.length() <= max_title_chars) {
        id(title_scroll_offset) = 0;
        id(title_scroll_pause_counter) = 0;
        it.printf(0, 0, id(basicfont), "%s", media_title.c_str());
      } else {
        std::string padded = media_title + "   ";
        int total_len = (int)padded.length();
        int offset = id(title_scroll_offset) % total_len;
        std::string doubled = padded + padded;
        std::string visible = doubled.substr(offset, max_title_chars);
        it.printf(0, 0, id(basicfont), "%s", visible.c_str());
      }

      // -- Artist --
      it.printf(0, 18, id(basicfont), "%s", media_artist.c_str());

      // -- Play/Pause icon + state label (second from bottom) --
      const char* play_icon  = "\U0000e037";
      const char* pause_icon = "\U0000e034";
      const char* media_icon = (player_state == "playing") ? pause_icon : play_icon;
      it.printf(0, 100, id(icon_font), "%s", media_icon);
      it.printf(18, 102, id(basicfont), "%s", player_state.c_str());

      // -- Player name (bottom) --
      it.printf(0, 114, id(basicfont_10), "%s", player_name.c_str());

text_sensor:
  - platform: homeassistant
    id: ma_queue_sensor
    entity_id: sensor.all_music_players
    attribute: players
    on_value:
      then:
        - lambda: |-
            std::string input = id(ma_queue_sensor).state;
            if (input == "none" || input.length() == 0) {
              id(current_entity_id) = "";
              id(current_index) = 0;
              return;
            }
            if (id(current_entity_id).empty() || id(current_entity_id) == "none") {
              std::vector<std::string> entries;
              size_t prev = 0, pos = 0;
              while ((pos = input.find("|||", prev)) != std::string::npos) {
                entries.push_back(input.substr(prev, pos - prev));
                prev = pos + 3;
              }
              entries.push_back(input.substr(prev));
              if (entries.size() > 0) {
                std::string entry = entries[0];
                std::vector<std::string> attrs;
                prev = 0;
                while ((pos = entry.find("::", prev)) != std::string::npos) {
                  attrs.push_back(entry.substr(prev, pos - prev));
                  prev = pos + 2;
                }
                attrs.push_back(entry.substr(prev));
                id(current_entity_id) = (attrs.size() > 0) ? attrs[0] : "";
                id(current_index) = 0;
              } else {
                id(current_entity_id) = "";
                id(current_index) = 0;
              }
            }

