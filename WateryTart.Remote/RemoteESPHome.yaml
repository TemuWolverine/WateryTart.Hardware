#CONFIG START
substitutions:
  name: WateryTart.Remote
  pin_i2c_sca: GPIO25
  pin_i2c_scl: GPIO26


  pin_vol_up: GPIO18
  pin_vol_down: GPIO23
  pin_vol_mute: GPIO19

  pin_player_next: GPIO34
  pin_player_previous: GPIO35

  pin_track_next: GPIO33
  pin_play_pause: GPIO27
  pin_track_previous: GPIO17

  pin_fav: GPIO14
  pin_repeat: GPIO21
  pin_shuffle: GPIO32

 # pin_misc_1: GPIO12

esphome:
  name: esphome-web-ee8248
  friendly_name: ${name}
  min_version: 2025.11.0
  name_add_mac_suffix: false

esp32:
  variant: esp32
  framework:
    type: esp-idf

logger:
api:
ota:
  - platform: esphome

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password

i2c:
  sda: ${pin_i2c_sca}
  scl: ${pin_i2c_scl}
  scan: false

globals:
  - id: current_index
    type: int
    initial_value: '0'

  - id: target_entity_id
    type: std::string
    restore_value: no
    initial_value: '""'

  - id: current_entity_id
    type: std::string
    restore_value: no
    initial_value: '""'

  - id: title_scroll_offset
    type: int
    restore_value: no
    initial_value: '0'

  # Counts up from 0, scrolling only starts after a threshold
  - id: title_scroll_pause_counter
    type: int
    restore_value: no
    initial_value: '0'

  # Track the last title so we can reset scroll when it changes
  - id: last_title
    type: std::string
    restore_value: no
    initial_value: '""'

# Font definitions
font:
  - file: 
      type: gfonts
      family: Roboto Mono
      weight: 400
    id: basicfont
    size: 12

  - file: 
      type: gfonts
      family: Roboto Mono
      weight: 400
    id: basicfont_10
    size: 10

  - file: 'gfonts://Material+Symbols+Outlined'
    id: icon_font
    size: 14
    glyphs: [
      "\U0000e034", # Pause
      "\U0000e037"  # Play
    ]

interval:
  # Runs every 300ms — increments scroll offset after a pause period
  # pause_counter threshold of 10 = 10 * 300ms = 3 seconds pause before scroll
  - interval: 300ms
    then:
      - lambda: |-
          const int PAUSE_TICKS = 10; // 10 * 300ms = 3 seconds before scrolling starts
          id(title_scroll_pause_counter) += 1;
          if (id(title_scroll_pause_counter) > PAUSE_TICKS) {
            id(title_scroll_offset) += 1;
          }

display:
  - platform: ssd1306_i2c
    model: "SH1106 128x64"
    rotation: 180
    address: 0x3C
    contrast: 70%
    id: oled_display

    lambda: |-
      std::string input = id(ma_queue_sensor).state;
      if (input == "none" || input.length() == 0) {
        it.printf(0, 0, id(basicfont), "No players found");
        return;
      }

      // Split into player entries
      std::vector<std::string> entries;
      size_t prev = 0, pos = 0;
      while ((pos = input.find("|||", prev)) != std::string::npos) {
        entries.push_back(input.substr(prev, pos - prev));
        prev = pos + 3;
      }
      entries.push_back(input.substr(prev));
      int idx = id(current_index);
      if (idx < 0) idx = 0;
      if (idx >= (int)entries.size()) idx = 0;
      std::string entry = entries[idx];
      std::vector<std::string> attrs;
      prev = 0;
      while ((pos = entry.find("::", prev)) != std::string::npos) {
        attrs.push_back(entry.substr(prev, pos - prev));
        prev = pos + 2;
      }
      attrs.push_back(entry.substr(prev));

      std::string entity_id    = (attrs.size() > 0) ? attrs[0] : "";
      std::string media_title  = (attrs.size() > 1) ? attrs[1] : "";
      std::string media_artist = (attrs.size() > 2) ? attrs[2] : "";
      std::string source       = (attrs.size() > 3) ? attrs[3] : "";
      std::string player_name  = (attrs.size() > 4) ? attrs[4] : "";
      std::string player_state = (attrs.size() > 5) ? attrs[5] : "";
      std::string repeat       = (attrs.size() > 6) ? attrs[6] : "";

      // -- Reset scroll if title has changed --
      if (media_title != id(last_title)) {
        id(last_title) = media_title;
        id(title_scroll_offset) = 0;
        id(title_scroll_pause_counter) = 0;
      }

      // -- Display constants --
      // Icon occupies x=112 to x=126 (14px wide)
      // Usable title area = 112px wide, ~16 chars at 7px/char
      const int max_title_chars = 16;
      const int icon_x = 112;

      // -- Play/pause icon --
      const char* play_icon  = "\U0000e037";
      const char* pause_icon = "\U0000e034";
      const char* media_icon = (player_state == "playing") ? pause_icon : play_icon;
      it.printf(icon_x, 0, id(icon_font), "%s", media_icon);

      // -- Scrolling title --
      if ((int)media_title.length() <= max_title_chars) {
        // Short enough — static display, no scroll needed
        id(title_scroll_offset) = 0;
        id(title_scroll_pause_counter) = 0;
        it.printf(0, 0, id(basicfont), "%s", media_title.c_str());
      } else {
        // Add a gap so the title has a clear restart point
        std::string padded = media_title + "   ";
        int total_len = (int)padded.length();
        int offset = id(title_scroll_offset) % total_len;
        // Build visible string by wrapping around the padded title
        std::string doubled = padded + padded;
        std::string visible = doubled.substr(offset, max_title_chars);
        it.printf(0, 0, id(basicfont), "%s", visible.c_str());
      }

      // -- Artist --
      it.printf(0, 18, id(basicfont), "%s", media_artist.c_str());

      // -- Player name --
      it.printf(0, 44, id(basicfont_10), "%s", player_name.c_str());

text_sensor:
  - platform: homeassistant
    id: ma_queue_sensor
    entity_id: sensor.all_music_players
    attribute: players
    on_value:
      then:
        - lambda: |-
            std::string input = id(ma_queue_sensor).state;
            if (input == "none" || input.length() == 0) {
              id(current_entity_id) = "";
              id(current_index) = 0;
              return;
            }
            if (id(current_entity_id).empty() || id(current_entity_id) == "none") {
              std::vector<std::string> entries;
              size_t prev = 0, pos = 0;
              while ((pos = input.find("|||", prev)) != std::string::npos) {
                entries.push_back(input.substr(prev, pos - prev));
                prev = pos + 3;
              }
              entries.push_back(input.substr(prev));
              if (entries.size() > 0) {
                std::string entry = entries[0];
                std::vector<std::string> attrs;
                prev = 0;
                while ((pos = entry.find("::", prev)) != std::string::npos) {
                  attrs.push_back(entry.substr(prev, pos - prev));
                  prev = pos + 2;
                }
                attrs.push_back(entry.substr(prev));
                id(current_entity_id) = (attrs.size() > 0) ? attrs[0] : "";
                id(current_index) = 0;
              } else {
                id(current_entity_id) = "";
                id(current_index) = 0;
              }
            }

binary_sensor:

# Top row
  - platform: gpio
    pin:
      number: ${pin_track_previous}
      mode:
        input: true
        pullup: true

    name: "PreviousTrack Button"
    id: previoustrack_button
    on_press:
      then:
        - homeassistant.service:
            service: media_player.media_previous_track
            data:
              entity_id: !lambda 'return id(current_entity_id);'

  - platform: gpio
    pin:
      number: ${pin_play_pause}
      mode:
        input: true
        pullup: true
    name: "PlayPause Button"
    id: play_pause_button
    on_press:
      then:
        - homeassistant.service:
            service: media_player.media_play_pause
            data:
              entity_id: !lambda 'return id(current_entity_id);'

  - platform: gpio
    pin:
      number: ${pin_track_next}
      mode:
        input: true
        pullup: true
    name: "NextTrack Button"
    id: nexttrack_button
    on_press:
      then:
        - homeassistant.service:
            service: media_player.media_next_track
            data:
              entity_id: !lambda 'return id(current_entity_id);'

# Middle Row
  - platform: gpio
    pin:
        number: ${pin_repeat}
        mode:
          input: true
          pullup: true
    name: "Repeat Button"
    id: repeat_button
    on_press:
      then:
        - homeassistant.service:
            service: media_player.repeat_set
            data:
              entity_id: !lambda 'return id(current_entity_id);'
              repeat: all #off/all/one

# - platform: gpio
#     pin:
#       number: ${pin_fav}
#       mode:
#         input: true
#         pullup: true

  - platform: gpio
    pin:
        number: ${pin_shuffle}
        mode:
          input: true
          pullup: true

    name: "Shuffle Button"
    id: shuffle_button
    on_press:
      then:
        - homeassistant.service:
            service: media_player.shuffle_set
            data:
              entity_id: !lambda 'return id(current_entity_id);'
              shuffle: 'true' #true/false


  #pin_fav: GPIO14 ##No such HA command
  #pin_repeat: GPIO21 #media_player.repeat_set off/all/one
  #pin_shuffle: GPIO32 #media_player.shuffle_set true/false

#Volume Rocker
  - platform: gpio
    pin:
        number: ${pin_vol_up}
        mode:
          input: true
          pullup: true

    name: "VolUp Button"
    id: volup_button
    on_press:
      then:
        - homeassistant.service:
            service: media_player.volume_up
            data:
              entity_id: !lambda 'return id(current_entity_id);'

  - platform: gpio
    pin:
        number: ${pin_vol_down}
        mode:
          input: true
          pullup: true

    name: "VolDown Button"
    id: voldown_button
    on_press:
      then:
        - homeassistant.service:
            service: media_player.volume_down
            data:
              entity_id: !lambda 'return id(current_entity_id);'

  - platform: gpio
    pin:
        number: ${pin_vol_mute}
        mode:
          input: true
          pullup: true

    name: "Mute Button"
    id: mute_button
    on_press:
      then:
        - homeassistant.service:
            service: media_player.is_volume_muted
            data:
              entity_id: !lambda 'return id(current_entity_id);'
              shuffle: 'true' #true/false

#Player Rocker
  - platform: gpio
    id: next_button
    pin:
      number: ${pin_player_next}
      mode:
        input: true
        #pullup: true

    on_press:
      then:
        - lambda: |-
            std::string input = id(ma_queue_sensor).state;
            if (input == "none" || input.length() == 0) return;
            std::vector<std::string> entries;
            size_t prev = 0, pos = 0;
            while ((pos = input.find("|||", prev)) != std::string::npos) {
              entries.push_back(input.substr(prev, pos - prev));
              prev = pos + 3;
            }
            entries.push_back(input.substr(prev));
            int idx = id(current_index) + 1;
            if (idx < 0) idx = 0;
            if (idx >= (int)entries.size()) idx = 0;
            id(current_index) = idx;
            // Also reset scroll on player change
            id(title_scroll_offset) = 0;
            id(title_scroll_pause_counter) = 0;
            // Parse selected entry
            std::string entry = entries[idx];
            std::vector<std::string> attrs;
            prev = 0;
            while ((pos = entry.find("::", prev)) != std::string::npos) {
              attrs.push_back(entry.substr(prev, pos - prev));
              prev = pos + 2;
            }
            attrs.push_back(entry.substr(prev));
            std::string entity_id = (attrs.size() > 0) ? attrs[0] : "";
            id(current_entity_id) = entity_id;


  - platform: gpio
    id: previous_button
    pin:
      number: ${pin_player_previous}
      mode:
        input: true
        #pullup: true

    on_press:
      then:
        - lambda: |-
            std::string input = id(ma_queue_sensor).state;
            if (input == "none" || input.length() == 0) return;
            std::vector<std::string> entries;
            size_t prev = 0, pos = 0;

            while ((pos = input.find("|||", prev)) != std::string::npos) {
              entries.push_back(input.substr(prev, pos - prev));
              prev = pos + 3;
            }
            entries.push_back(input.substr(prev));
            int idx = id(current_index) - 1;
            if (idx < 0) idx = (int)entries.size() - 1;
            if (idx >= (int)entries.size()) idx = 0;
            id(current_index) = idx;
            // Also reset scroll on player change
            id(title_scroll_offset) = 0;
            id(title_scroll_pause_counter) = 0;
            // Parse selected entry
            std::string entry = entries[idx];
            std::vector<std::string> attrs;
            prev = 0;
            while ((pos = entry.find("::", prev)) != std::string::npos) {
              attrs.push_back(entry.substr(prev, pos - prev));
              prev = pos + 2;
            }
            attrs.push_back(entry.substr(prev));
            std::string entity_id = (attrs.size() > 0) ? attrs[0] : "";
            id(current_entity_id) = entity_id;